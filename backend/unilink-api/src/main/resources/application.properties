spring.application.name=unilink-api
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/unilinkdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.database.admin-url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB